<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit Converter</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">
  <h1>Unit Converter</h1>

  <label for="numberInput">Enter a number</label>
  <input type="number" id="numberInput" step="any">

  <label for="conversionType">Select conversion</label>
  <select id="conversionType">
    <option value="cm-to-m">Centimeters → Meters</option>
    <option value="km-to-m">Kilometers → Meters</option>
    <option value="kg-to-g">Kilograms → Grams</option>
  </select>

  <button onclick="convertValue()">Convert</button>

  <div class="result-box" id="resultBox"></div>
</div>

<script src="script.js"></script>
</body>
</html>
